# Electron 打包配置（electron-builder）
#
# 设计取舍：
#  - productName 用 ASCII 的 StockSim，是为了让第一次构建尽量顺利（NSIS 对非 ASCII 产品名
#    偶有编码问题）。窗口标题仍是中文「股市模拟」，见 electron/main.cjs。
#    如果你希望 exe 与开始菜单里显示中文名，把下面这行改成 productName: 股市模拟 即可。
#  - files 只列游戏真正需要的东西：单文件游戏、主进程、图表库。
#    node_modules/lightweight-charts 是必须的——游戏离线时要靠它画 K 线，
#    否则只能退回内置的 Canvas 简易图。

appId: com.liuchen.stock-sim
productName: StockSim
copyright: 仅供学习与娱乐，不构成任何投资建议

directories:
  output: dist-electron
  buildResources: build

files:
  - 股市模拟.html
  - electron/main.cjs
  - package.json
  - node_modules/lightweight-charts/dist/lightweight-charts.standalone.production.js

asar: true
compression: normal

win:
  target:
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]
  # 没有图标时 electron-builder 会使用默认的 Electron 图标。
  # 想换成自己的图标：放一个 256×256 的 build/icon.ico，然后取消下面这行注释。
  # icon: build/icon.ico

portable:
  artifactName: StockSim-${version}-portable.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: StockSim-${version}-setup.${ext}
