  ];

  const NEWS_TEMPLATES = {
    macroGood: ['央行宣布降准 0.5 个百分点，释放长期资金约 {n} 亿元', '监管层表态支持长期资金入市，市场预期改善', '制造业 PMI 回升至 {n}，好于市场预期'],
    macroBad:  ['海外主要市场隔夜大跌 {n}%，避险情绪升温', '监管收紧融资通道，市场担心流动性', 'CPI 数据超预期，市场担忧货币政策转向'],
    indGood:   ['{ind}板块迎来产业政策扶持，行业景气度回升', '{ind}下游需求超预期，机构上调行业评级', '{ind}产品价格上涨 {n}%，龙头企业受益'],
    indBad:    ['{ind}原材料成本大幅上涨，行业毛利承压', '{ind}竞争加剧，产品价格战开启', '{ind}出口订单下滑，机构下调行业预期'],
    stkGood:   ['{name}发布业绩预告，净利润同比预增 {n}%', '{name}公告中标大额订单，合同金额 {n} 亿元', '{name}新产品获批上市，打开成长空间'],
    stkBad:    ['{name}公告股东拟减持不超过 {n}% 股份', '{name}业绩快报低于预告，净利润同比下滑', '{name}被曝应收账款异常，遭交易所问询'],
    scandal:   ['{name}被立案调查，涉嫌信息披露违法违规', '{name}被曝财务造假，审计机构出具非标意见'],
    rumorGood: ['传闻：{name}正在洽谈并购重组（未经证实）', '传闻：{ind}板块将获政策支持（未经证实）'],
    rumorBad:  ['传闻：{name}大股东资金链紧张（未经证实）', '传闻：监管将收紧{ind}行业融资（未经证实）'],
    ambient:   ['两市成交额 {n} 亿元，市场情绪平稳', '北向资金今日净流入 {n} 亿元', '本周将有 {n} 只新股申购',
                '两融余额升至 {n} 亿元，杠杆资金转为活跃', '本周限售股解禁市值 {n} 亿元，抛压集中在中小盘',
                '机构调研热度回升，{n} 家公司本周接待调研', '多家券商发布策略报告，对后市分歧加大'],
  };

  /* --------------------------------------------------------------- 随机数 */
  /**
   * mulberry32 种子随机数发生器。同一种子必然产生完全相同的序列，
   * 这是"存档可复现"与"测试可断言"的基础。
   */
  function createRng(seed) {
    let a = (seed >>> 0) || 1;
    const next = () => {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const normal = () => {
      let u = 0, v = 0;
      while (u === 0) u = next();
      while (v === 0) v = next();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    };
    /** 标准化学生 t 分布（厚尾），用于让暴涨暴跌比正态更频繁。 */
    const studentT = (nu) => {
      let chi2 = 0;
      for (let i = 0; i < nu; i++) { const z = normal(); chi2 += z * z; }
      const t = normal() / Math.sqrt(chi2 / nu);
      return t / Math.sqrt(nu / (nu - 2)); // 方差归一
    };
    const range = (lo, hi) => lo + (hi - lo) * next();
    const int = (lo, hi) => Math.floor(lo + (hi - lo + 1) * next());
    const pick = (arr) => arr[Math.floor(next() * arr.length)];
    const shuffle = (arr) => {
      const out = arr.slice();
      for (let i = out.length - 1; i > 0; i--) {
        const j = Math.floor(next() * (i + 1));
        [out[i], out[j]] = [out[j], out[i]];
      }
      return out;
    };
    /** 从 weights 指定的离散分布中取一个下标。 */
    const weightedIndex = (weights) => {
      const total = weights.reduce((s, w) => s + w, 0);
      let r = next() * total;
      for (let i = 0; i < weights.length; i++) { r -= weights[i]; if (r <= 0) return i; }
      return weights.length - 1;
    };
    return { next, normal, studentT, range, int, pick, shuffle, weightedIndex, seed: seed >>> 0 };
  }

  /* ------------------------------------------------------------- 交易日历 */
  /** 按本地日历取 ISO 日期：不能用 toISOString()，否则东八区会整体差一天。 */
  function isoOf(date) {
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${date.getFullYear()}-${m}-${d}`;
  }

  function buildCalendar(config) {
    const holidays = new Set(config.time.holidays);
    const days = [];
    const cursor = new Date(config.time.startDate + 'T00:00:00');
    while (days.length < config.time.tradingDays) {
      const dow = cursor.getDay();
      const iso = isoOf(cursor);
      if (dow !== 0 && dow !== 6 && !holidays.has(iso)) {
        days.push({ index: days.length, iso, label: `${cursor.getMonth() + 1}月${cursor.getDate()}日` });
      }
      cursor.setDate(cursor.getDate() + 1);
    }
    return days;
  }

  /* ------------------------------------------------------- 市场状态与事件 */
  /** 生成 45 天的大盘状态时间线（半马尔可夫：状态有惯性）。 */
  function buildRegimePlan(rng, totalDays, config) {
    const order = ['up', 'range', 'down', 'crash'];
    const nextWeights = {
      up:    { up: 0.55, range: 0.30, down: 0.15, crash: 0.00 },
      range: { up: 0.35, range: 0.30, down: 0.33, crash: 0.02 },
      down:  { up: 0.22, range: 0.28, down: 0.42, crash: 0.08 },
      crash: { up: 0.35, range: 0.45, down: 0.20, crash: 0.00 },
    };
    const plan = [];
    let used = 0;
    let current = 'range';
    while (used < totalDays) {
      const spec = config.regimes[current];
      const dur = Math.max(3, Math.round(spec.meanDays * rng.range(0.7, 1.3)));
      const take = Math.min(dur, totalDays - used);
      plan.push({ state: current, start: used, days: take });
      used += take;
      const w = nextWeights[current];
      current = order[rng.weightedIndex(order.map((k) => w[k]))];
    }
    return plan;
  }

  function regimeAt(plan, dayIndex) {
    for (const seg of plan) if (dayIndex >= seg.start && dayIndex < seg.start + seg.days) return seg.state;
    return 'range';
  }

  /**
   * 生成 45 天的事件时间线。价格由这些事件驱动，所以玩家读到的新闻
   * 与随后的走势必然自洽（先事件、后价格）。
   */
  function buildEvents(rng, stocks, calendar, config) {
    const events = [];
    const push = (e) => events.push(e);

    /* 宏观事件：影响整个市场 */
    const macroCount = rng.int(3, 5);
    const macroDays = rng.shuffle(calendar.map((d) => d.index)).slice(0, macroCount).sort((a, b) => a - b);
    for (const day of macroDays) {
      const good = rng.next() < 0.55;
      const magnitude = rng.range(0.0012, 0.0035);
      push({
        day, scope: 'market', tone: good ? 'good' : 'bad',
        driftPerDay: (good ? 1 : -1) * magnitude,
        duration: rng.int(3, 8),
        headline: renderTemplate(rng, good ? 'macroGood' : 'macroBad', {}),
      });
    }

    /* 行业事件 */
    const indCount = rng.int(4, 6);
    for (let i = 0; i < indCount; i++) {
      const day = rng.int(3, config.time.tradingDays - 6);
      const indIdx = rng.int(0, INDUSTRIES.length - 1);
      const good = rng.next() < 0.5;
      push({
        day, scope: 'industry', key: indIdx, tone: good ? 'good' : 'bad',
        driftPerDay: (good ? 1 : -1) * rng.range(0.0018, 0.0045),
        duration: rng.int(4, 12),
        headline: renderTemplate(rng, good ? 'indGood' : 'indBad', { ind: INDUSTRIES[indIdx].name }),
      });
    }

    /* 公司事件：业绩预告（贴合 1 月）、年报快报、订单、减持、暴雷 */
    const forecastStart = config.earnings.forecastWindow[0];
    const reportStart = config.earnings.reportWindow[0];
    stocks.forEach((s, idx) => {
      // 业绩预告：超预期者产生 PEAD 漂移
      const surprise = rng.normal() * 0.18 + s.quality * 0.12;
      const day = rng.int(forecastStart, config.earnings.forecastWindow[1]);
      push({
        day, scope: 'stock', key: idx, tone: surprise > 0 ? 'good' : 'bad', kind: 'forecast',
        surprise,
        driftPerDay: Math.sign(surprise) * config.balance.peadAlpha * Math.min(1, Math.abs(surprise) / 0.2) / 10,
        duration: 8,
        headline: `${s.name}发布业绩预告，净利润同比${surprise >= 0 ? '预增' : '预减'} ${Math.abs(surprise * 100).toFixed(0)}%`,
        isAnnouncement: true,
      });
      // 年报快报：可能打脸预告
      if (rng.next() < 0.7) {
        const gap = rng.normal() * 0.15;
        const rDay = rng.int(reportStart, config.earnings.reportWindow[1]);
        push({
          day: rDay, scope: 'stock', key: idx, tone: gap > 0 ? 'good' : 'bad', kind: 'report',
          driftPerDay: Math.sign(gap) * rng.range(0.001, 0.0035),
          duration: 5,
          headline: `${s.name}披露年报快报，净利润${gap >= 0 ? '高于' : '低于'}此前预告`,
          isAnnouncement: true,
        });
      }
      // 随机公司喜讯
      if (rng.next() < 0.35) {
        push({
          day: rng.int(4, config.time.tradingDays - 5), scope: 'stock', key: idx, tone: 'good', kind: 'order',
          driftPerDay: rng.range(0.002, 0.005), duration: rng.int(3, 6),
          headline: renderTemplate(rng, 'stkGood', { name: s.name }),
          isAnnouncement: true,
        });
      }
      // 随机公司利空
      if (rng.next() < 0.30) {
        push({
          day: rng.int(4, config.time.tradingDays - 5), scope: 'stock', key: idx, tone: 'bad', kind: 'reduce',
          driftPerDay: -rng.range(0.0015, 0.004), duration: rng.int(3, 6),
          headline: renderTemplate(rng, 'stkBad', { name: s.name }),
          isAnnouncement: true,
        });
      }
    });

    /* 暴雷：A 层最强负面，以连续跌停兑现，并可能变 ST */
    const scandalCount = rng.int(1, 2);
    const scandalTargets = rng.shuffle(stocks.map((_, i) => i)).slice(0, scandalCount);
    for (const idx of scandalTargets) {
      const day = rng.int(10, config.time.tradingDays - 8);
      push({
        day, scope: 'stock', key: idx, tone: 'bad', kind: 'scandal',
        driftPerDay: 0, duration: 0, limitStreak: { dir: 'down', days: rng.int(2, 3) },
        becomesST: true,
        headline: renderTemplate(rng, 'scandal', { name: stocks[idx].name }),
        isAnnouncement: true,
      });
    }

    /* 传闻：不驱动价格，只制造噪音（约 30% 的消息不真实） */
    const rumorCount = rng.int(5, 8);
    for (let i = 0; i < rumorCount; i++) {
      const day = rng.int(2, config.time.tradingDays - 2);
      const tpl = rng.pick(['rumorGood', 'rumorBad']);
      const idx = rng.int(0, stocks.length - 1);
      push({
        day, scope: 'none', tone: 'rumor', kind: 'rumor',
        driftPerDay: 0, duration: 0,
        headline: renderTemplate(rng, tpl, { name: stocks[idx].name, ind: INDUSTRIES[stocks[idx].industryIdx].name }),
      });
    }

    /* 氛围消息：纯文字、不影响价格，但保证每个交易日盘前都有东西可读 */
    const ambientCount = rng.int(42, 56);
    for (let i = 0; i < ambientCount; i++) {
      push({
        day: rng.int(0, config.time.tradingDays - 1), scope: 'none', tone: 'neutral', kind: 'ambient',
        driftPerDay: 0, duration: 0,
        headline: renderTemplate(rng, 'ambient', {}),
      });
    }

    events.sort((a, b) => a.day - b.day || a.scope.localeCompare(b.scope));
    return events;
  }

  function renderTemplate(rng, key, vars) {
    let text = rng.pick(NEWS_TEMPLATES[key]);
    return text
      .replace('{name}', vars.name ?? '某公司')
      .replace('{ind}', vars.ind ?? '该')
      .replace(/\{n\}/g, () => (Math.round(rng.range(5, 480) * 10) / 10).toString());
  }

  /**
   * B 层随机跳动日程。硬约束：
   *  - 45 天内最多 10 次
   *  - 每个交易日最多 1 次（通过抽取互不重复的日子从结构上保证）
   *  - 幅度上限 6%，严格小于事件驱动的暴雷/暴涨
   */
  function buildJumpPlan(rng, stocks, totalDays, config) {
    const J = config.jumps;
    // 二项分布抽样，再截断到硬上限
    let count = 0;
    for (let i = 0; i < totalDays; i++) if (rng.next() < J.dailyProb) count++;
    count = Math.min(count, J.maxCount, totalDays);

    const days = rng.shuffle(Array.from({ length: totalDays }, (_, i) => i)).slice(0, count).sort((a, b) => a - b);
    return days.map((day) => {
      const isMarket = rng.next() < J.marketShare;
      const up = rng.next() < J.upRatio;
      if (isMarket) {
        const mag = rng.range(J.marketMagnitude[0], J.marketMagnitude[1]);
        return { day, scope: 'market', magnitude: up ? mag : -mag };
      }
      // 个股级：按特质波动加权，小盘题材股更容易跳
      const idx = rng.weightedIndex(stocks.map((s) => s.idioVol));
      const mag = rng.range(J.stockMagnitude[0], J.stockMagnitude[1]);
      return { day, scope: 'stock', key: idx, magnitude: up ? mag : -mag };
    });
  }

  /* --------------------------------------------------------------- 世界生成 */
  function generateWorld(seed, overrides) {
    const config = deepMerge(CONFIG, overrides ?? {});
    const rng = createRng(seed);
    const calendar = buildCalendar(config);

    const stocks = [];
    INDUSTRIES.forEach((ind, industryIdx) => {
      ind.names.forEach((name, j) => {
        const idx = stocks.length;
        const code = String(880000 + (industryIdx + 1) * 100 + (j + 1));
        stocks.push({
          index: idx,
          code,
          name,
          industryIdx,
          industry: ind.name,
          board: ind.board,
          limit: config.boards[ind.board],
          beta: clamp(rng.normal() * 0.25 + 1.0, 0.4, 1.8),
          idioVol: rng.range(0.25, 0.60),
          // 真实 alpha：全程不向玩家暴露，只能靠财报与走势去猜
          alpha: rng.normal() * 0.08,
          quality: rng.normal() * 0.5,
          price0: ind.price[j],
          floatCap: ind.cap[j] * 1e8,
          baseTurnover: rng.range(0.008, 0.035),
          eps0: ind.price[j] / rng.range(12, 45),
          growth: rng.normal() * 0.15 + 0.08,
          st: false,
          dividendYield: 0,
        });
      });
    });

    const regimePlan = buildRegimePlan(rng, config.time.tradingDays, config);
    const events = buildEvents(rng, stocks, calendar, config);
    const jumpPlan = buildJumpPlan(rng, stocks, config.time.tradingDays, config);

    // 分红：抽 2~3 家公司，在指定日除息
    const divTargets = rng.shuffle(stocks.map((_, i) => i)).slice(0, config.earnings.dividendCount);
    const dividends = divTargets.map((idx) => {
      const yieldPct = rng.range(0.015, 0.03);
      stocks[idx].dividendYield = yieldPct;
      return { day: config.earnings.dividendDay, stockIdx: idx, yield: yieldPct };
    });

    return { seed: rng.seed, config, calendar, stocks, regimePlan, events, jumpPlan, dividends, industries: INDUSTRIES };
  }

  /* --------------------------------------------------------------- 行情模拟 */
  /**
   * 一次性生成全部 45 天行情。未来数据只存在于返回值里，
   * UI 只被允许读取 ≤ 当前交易日的数据（防剧透靠这一层约定）。
   */
  function simulate(world) {
    const { config, calendar, stocks, regimePlan, events, jumpPlan, dividends } = world;
    const total = calendar.length;
    // 模拟阶段使用独立随机流：同一 seed 必然得到同一段行情（可复现、可测试）
    const rng0 = createRng((world.seed ^ 0x9e3779b9) >>> 0);
    const industryHeat = new Array(INDUSTRIES.length).fill(0);
    // 当日消息面情绪（用于驱动股民情绪指数）
    const tonesByDay = {};
    for (const e of events) {
      if (e.scope === 'none') continue;
      const sign = e.tone === 'good' ? 1 : e.tone === 'bad' ? -1 : 0;
      tonesByDay[e.day] = (tonesByDay[e.day] ?? 0) + sign;
    }
    // 春节前后：节前缩量、节后开门红的日历效应
    const quietDays = preHolidayDays(calendar, config);
    const reopenDay = calendar.findIndex((d) => d.iso > config.time.holidays[config.time.holidays.length - 1]);

    // 事件按天、按作用域摊平，便于逐日查表
    const marketDrift = new Array(total).fill(0);
    const industryDrift = INDUSTRIES.map(() => new Array(total).fill(0));
    const stockDrift = stocks.map(() => new Array(total).fill(0));
    const limitForced = new Map();   // `${stockIdx}:${day}` -> 'up' | 'down'
    const stFrom = new Array(stocks.length).fill(Infinity);

    for (const e of events) {
      if (e.scope === 'none') continue;
      for (let d = e.day; d < Math.min(total, e.day + e.duration); d++) {
        if (e.scope === 'market') marketDrift[d] += e.driftPerDay;
        else if (e.scope === 'industry') industryDrift[e.key][d] += e.driftPerDay;
        else stockDrift[e.key][d] += e.driftPerDay;
      }
      if (e.limitStreak) {
        for (let k = 0; k < e.limitStreak.days; k++) {
          const d = e.day + 1 + k; // 公告次日开始连续跌停
          if (d < total) limitForced.set(`${e.key}:${d}`, e.limitStreak.dir);
        }
      }
      if (e.becomesST) stFrom[e.key] = Math.min(stFrom[e.key], e.day + 1);
    }

    const jumpAt = new Map(jumpPlan.map((j) => [j.day, j]));

    // 情绪与波动率是逐日递推的，必须按顺序生成
    const emotion = new Array(total).fill(50);
    const indexBars = [];
    const dayBars = stocks.map(() => []);
    let sigma2 = Math.pow(0.20 / Math.sqrt(252), 2);
    let lastShock = 0;
    let indexClose = config.index.start;
    let emo = 50;
    const recentReturns = [];

    for (let t = 0; t < total; t++) {
      const state = regimeAt(regimePlan, t);
      const spec = config.regimes[state];
      const targetDailyVol = spec.vol / Math.sqrt(252);

      // GARCH(1,1)：波动率聚集（大跌之后还是大波动）
      const alpha = state === 'crash' ? config.vol.crashAlpha : config.vol.alpha;
      const beta = config.vol.beta;
      const omega = Math.max(1e-8, (1 - alpha - beta) * targetDailyVol * targetDailyVol);
      sigma2 = omega + alpha * lastShock * lastShock + beta * sigma2;
      const sigma = Math.sqrt(sigma2);

      // 情绪对短期漂移与波动的作用
      const emoDrift = (emo - 50) / 50 * config.balance.emotionDrift;
      const emoVolMult = 0.8 + emo / 100;

      const z = clamp(rng0.studentT(config.vol.nu) * 0.85, -6, 6);
      const shock = sigma * emoVolMult * z;
      lastShock = shock;

      let marketReturn = spec.drift + shock + marketDrift[t] + emoDrift;
      if (t === reopenDay) marketReturn += 0.004;   // 节后开门红的日历效应
      const mj = jumpAt.get(t);
      if (mj && mj.scope === 'market') marketReturn += mj.magnitude;

      const indexPrev = indexClose;
      const ib = makeBar(indexPrev, marketReturn, sigma, null, null, rng0);
      indexClose = ib.close;
      indexBars.push({
        day: t, date: calendar[t].iso, label: calendar[t].label,
        open: ib.open, high: ib.high, low: ib.low, close: ib.close,
        prevClose: indexPrev, volume: 0, amount: 0,
      });
      recentReturns.push(marketReturn);
      if (recentReturns.length > 5) recentReturns.shift();
      const mom5 = recentReturns.reduce((s, v) => s + v, 0);

      // 情绪更新：向"由近期行情与新闻决定的目标"靠拢
      const newsTone = tonesByDay[t] ?? 0;
      const targetEmo = clamp(50 + mom5 * 900 + newsTone * 8, 5, 95);
      emo = clamp(emo + 0.28 * (targetEmo - emo) + rng0.normal() * 2.5, 0, 100);
      emotion[t] = emo;

      // 行业 → 个股
      INDUSTRIES.forEach((ind, i) => {
        const heat = industryHeat[i];
        const secShock = ind.secVol / Math.sqrt(252) * rng0.normal();
        const indReturn = ind.beta * marketReturn + heat + secShock + industryDrift[i][t];
        industryHeat[i] = heat * 0.9 + rng0.normal() * (ind.secVol / Math.sqrt(252)) * 0.5;

        stocks.filter((s) => s.industryIdx === i).forEach((s) => {
          const bars = dayBars[s.index];
          const prev = bars.length ? bars[bars.length - 1].close : s.price0;

          // ST 状态变更：暴雷次日起涨跌停收窄至 ±5%（不改动共享的 world 对象）
          const isST = t >= stFrom[s.index];
          const limitPct = isST ? config.boards.st : s.limit;

          let r = s.beta * indReturn
            + s.alpha / 252
            + (s.idioVol / Math.sqrt(252)) * rng0.studentT(config.vol.nu)
            + stockDrift[s.index][t];

          const sj = jumpAt.get(t);
          if (sj && sj.scope === 'stock' && sj.key === s.index) r += sj.magnitude;

          // 除息：价格下调，现金由组合层派发
          const div = dividends.find((d) => d.day === t && d.stockIdx === s.index);
          if (div) r -= div.yield;

          // A 层暴雷：强制连续跌停（一字板，卖不出去）
          const forced = limitForced.get(`${s.index}:${t}`);
          let bar;
          if (forced) {
            const limitPrice = round2(prev * (1 + (forced === 'down' ? -limitPct : limitPct)));
            bar = { open: limitPrice, high: limitPrice, low: limitPrice, close: limitPrice, forced: true };
          } else {
            const clipped = clamp(r, -limitPct, limitPct);
            bar = makeBar(prev, clipped, sigma, r, limitPct, rng0);
          }

          // 成交量：随波动、情绪、节前缩量
          const seasonal = quietDays.has(t) ? 0.7 : 1;
          const turnover = s.baseTurnover
            * (1 + 2.5 * Math.abs((bar.close - prev) / prev))
            * (0.6 + emo / 100)
            * seasonal
            * Math.exp(rng0.normal() * 0.4 - 0.08);
          const volume = Math.max(1, (s.floatCap / bar.close) * turnover);
          const amount = volume * bar.close;

          bars.push({
            day: t, date: calendar[t].iso, label: calendar[t].label,
            open: bar.open, high: bar.high, low: bar.low, close: bar.close,
            prevClose: prev, volume: Math.round(volume), amount,
            limitUp: round2(prev * (1 + limitPct)), limitDown: round2(prev * (1 - limitPct)),
            st: isST, forced: !!bar.forced,
          });
        });
      });
    }

    return {
      world,
      calendar,
      index: indexBars,
      stocks: stocks.map((s, i) => ({ ...s, days: dayBars[i] })),
      emotion,
      news: buildNewsByDay(world, total),
      meta: { totalDays: total },
    };
  }

  function buildNewsByDay(world, total) {
    const byDay = Array.from({ length: total }, () => []);
    for (const e of world.events) {
      if (e.day < 0 || e.day >= total) continue;
      // 只有 kind === 'rumor' 的条目才是真正不影响价格的传闻
      const rumor = e.kind === 'rumor';
      byDay[e.day].push({
        scope: e.scope, tone: e.tone, kind: e.kind,
        stockIdx: e.scope === 'stock' ? e.key : null,
        industryIdx: e.scope === 'industry' ? e.key : null,
        headline: e.headline,
        rumor,
      });
    }
    return byDay;
  }

  /** 春节前最后几个交易日的位置（休市日本身不产生交易日）。 */
  function preHolidayDays(calendar, config) {
    const lastHoliday = config.time.holidays[config.time.holidays.length - 1];
    const set = new Set();
    const firstAfter = calendar.findIndex((d) => d.iso > lastHoliday);
    if (firstAfter < 0) return set;
    for (let k = 1; k <= 3; k++) if (firstAfter - k >= 0) set.add(firstAfter - k);
    return set;
  }

  /** 由日收益合成一根 OHLC（布朗桥近似日内路径极值）。 */
  function makeBar(prev, ret, sigma, rawRet, limitPct, rng) {
    const close = round2(prev * (1 + ret));
    const gap = rng.normal() * sigma * 0.35;
    let open = round2(prev * (1 + gap));
    const span = Math.abs(close - open);
    const wiggle = (span + prev * sigma * 0.6) * Math.abs(rng.normal()) * 0.5;
    let high = round2(Math.max(open, close) + wiggle);
    let low = round2(Math.min(open, close) - wiggle * 0.9);
    if (limitPct) {
      high = Math.min(high, round2(prev * (1 + limitPct)));
      low = Math.max(low, round2(prev * (1 - limitPct)));
    }
    high = Math.max(high, open, close);
    low = Math.min(low, open, close);
    low = Math.max(low, 0.5);
    return { open, high, low, close };
  }

  /* ------------------------------------------------------------------ 工具 */
  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
  function round2(v) { return Math.round(v * 100) / 100; }
  function deepMerge(base, over) {
    if (Array.isArray(base)) return over ?? base;
    if (typeof base !== 'object' || base === null) return over === undefined ? base : over;
    const out = { ...base };
    for (const k of Object.keys(over ?? {})) {
      out[k] = (k in base) ? deepMerge(base[k], over[k]) : over[k];
    }
    return out;
  }

  /* -------------------------------------------------------------- 组合账户 */
  function createPortfolio(cash) {
    return {
      cash,
      positions: {},      // stockIdx -> { qty, available, frozen, avgCost, realized }
      equityCurve: [],
      feeTotal: 0,
      trades: [],
      closedTrades: [],
    };
  }

  function positionOf(pf, idx) {
    if (!pf.positions[idx]) {
      pf.positions[idx] = { stockIdx: idx, qty: 0, available: 0, frozen: 0, avgCost: 0, realized: 0 };
    }
    return pf.positions[idx];
  }

  /** 每个交易日开始时调用：把昨日买入的股票变为可卖。 */
  function startDay(pf) {
    for (const pos of Object.values(pf.positions)) pos.available = pos.qty - pos.frozen;
  }

  function buyFees(value, config) {
    const c = config.cost;
    return Math.max(c.commissionMin, value * c.commission) + value * c.transferFee;
  }
  function sellFees(value, config) {
    const c = config.cost;
    return Math.max(c.commissionMin, value * c.commission)
      + value * c.stampTax
      + value * c.transferFee;
  }

  /* ---------------------------------------------------------------- 撮合器 */
  function createBroker(portfolio, market, config) {
    const state = {
      day: 0,                       // 当前待结算的交易日
      orders: [],
      orderSeq: 1,
      notices: [],
      finished: false,
    };

    function barOf(stockIdx, day) { return market.stocks[stockIdx].days[day]; }

    /**
     * 挂单冻结资金：全部未成交买单的预估金额之和。
     *
     * 刻意「由挂单推导」而不是单独维护一个标量：撤单、成交、失效三条路径
     * 都要记得释放，漏一条就会永久占住资金；推导出来则天然不会漏，
     * 也不会因反复加减产生浮点漂移，存档格式还不用动。
     * 旧存档里的买单没有 frozenCash 字段，按 0 兜底（结算时仍按真实资金校验）。
     */
    function frozenCash() {
      let sum = 0;
      for (const o of state.orders) if (o.side === 'buy') sum += o.frozenCash ?? 0;
      return sum;
    }

    /** 可用现金 = 账户现金 − 挂单冻结。下单时该看的是这个，而不是账面现金。 */
    function availableCash() {
      return Math.max(0, portfolio.cash - frozenCash());
    }

    /**
     * 下单：只会挂到当日结算时撮合，玩家看不到当日价格。
     *
     * 买单在下单时就按昨收价冻结一笔预估资金（贴近期货之外的国内券商做法），
     * 于是「可用现金」在下单瞬间就变小 —— 也挡掉了「连着挂三笔全仓买单、
     * 结算时只有一笔有钱成交」这种超额挂单。
     */
    function placeOrder(req) {
      if (state.finished) return fail('本局已结束');
      const s = market.stocks[req.stockIdx];
      if (!s) return fail('标的不存在');
      const lot = config.rules.lotSize;
      const qty = Math.floor(req.qty / lot) * lot;
      if (!(qty >= lot)) return fail(`数量必须是 ${lot} 股的整数倍`);

      const refBar = state.day > 0 ? barOf(req.stockIdx, state.day - 1) : null;
      const refPrice = refBar ? refBar.close : s.price0;

      if (req.type === 'limit') {
        if (!(req.limitPrice > 0)) return fail('限价必须大于 0');
      }

      let frozen = 0;
      if (req.side === 'buy') {
        // 预估按最坏成本算：滑点上限 + 1% 缓冲
        const est = qty * refPrice * (1 + config.cost.slippageCap + 0.01);
        const avail = availableCash();
        if (est > avail) {
          return fail(`可用资金不足：可用 ${round2(avail)} 元（已扣除挂单冻结，按昨收价估算）`);
        }
        frozen = est;
      } else {
        const pos = positionOf(portfolio, req.stockIdx);
        if (qty > pos.available) {
          return fail(`可卖数量不足：可卖 ${pos.available} 股（当日买入的股票次日才可卖）`);
        }
        pos.frozen += qty;
      }

      const order = {
        id: state.orderSeq++,
        stockIdx: req.stockIdx,
        side: req.side,
        type: req.type,
        qty,
        limitPrice: req.type === 'limit' ? round2(req.limitPrice) : null,
        placedDay: state.day,
        remainingDays: req.type === 'limit'
          ? clamp(Number(req.validity) || 1, config.rules.limitOrderValidity[0], config.rules.limitOrderValidity[1])
          : 1,
        frozenCash: frozen,   // 买单占用的预估资金；卖单恒为 0
      };
      state.orders.push(order);
      return { ok: true, order };
    }

    function cancelOrder(id) {
      const i = state.orders.findIndex((o) => o.id === id);
      if (i < 0) return fail('委托不存在或已成交');
      const o = state.orders[i];
      if (o.side === 'sell') positionOf(portfolio, o.stockIdx).frozen -= o.qty;
      state.orders.splice(i, 1);
      return { ok: true };
    }

    function fail(reason) { return { ok: false, reason }; }

    /** 计算滑点：订单额占当日成交额越大，冲击成本越高。 */
    function slippage(orderValue, dayAmount) {
      const c = config.cost;
      const impact = dayAmount > 0 ? (orderValue / dayAmount) * c.slippageImpact : 0;
      return Math.min(c.slippageCap, c.slippageBase + impact);
    }

    /**
     * 结算第 T 个交易日：撮合当日委托、处理涨跌停封锁、分红、利息，并记录权益。
     */
    function settleDay() {
      const t = state.day;
      if (t >= market.meta.totalDays) return { ok: false, reason: '已到最后一个交易日' };

      const filled = [];
      const kept = [];

      // 撤单 / 拒绝 / 失效时都必须释放卖单冻结的股数，否则持仓会被永久锁死
      const release = (o) => {
        if (o.side === 'sell') positionOf(portfolio, o.stockIdx).frozen -= o.qty;
      };

      for (const o of state.orders) {
        const bar = barOf(o.stockIdx, t);
        let price = null;

        if (o.type === 'market') {
          // 涨停买不进、跌停卖不出
          if (o.side === 'buy' && bar.close >= bar.limitUp) {
            release(o); filled.push({ order: o, status: 'rejected', reason: '涨停无法买入' }); continue;
          }
          if (o.side === 'sell' && bar.close <= bar.limitDown) {
            release(o); filled.push({ order: o, status: 'rejected', reason: '跌停无法卖出' }); continue;
          }
          price = bar.close;
        } else if (o.side === 'buy') {
          if (bar.low <= o.limitPrice) price = Math.min(o.limitPrice, bar.open);
        } else {
          if (bar.high >= o.limitPrice) price = Math.max(o.limitPrice, bar.open);
        }

        if (price === null) {
          o.remainingDays -= 1;
          if (o.remainingDays > 0) kept.push(o);
          else {
            release(o);
            filled.push({ order: o, status: 'expired', reason: '限价未触发，委托失效' });
          }
          continue;
        }

        const slip = slippage(o.qty * price, bar.amount);
        const execPrice = round2(o.side === 'buy' ? price * (1 + slip) : price * (1 - slip));
        let qty = o.qty;

        if (o.side === 'buy') {
          // 资金不足时按可负担的整手数缩减，而不是直接废单
          const lot = config.rules.lotSize;
          const affordable = Math.floor(portfolio.cash / (execPrice * (1 + config.cost.slippageCap) * 1.02) / lot) * lot;
          if (affordable < lot) { filled.push({ order: o, status: 'rejected', reason: '资金不足' }); continue; }
          if (affordable < qty) qty = affordable;
        }

        const value = qty * execPrice;
        if (o.side === 'buy') {
          const fees = buyFees(value, config);
          if (value + fees > portfolio.cash) { filled.push({ order: o, status: 'rejected', reason: '资金不足' }); continue; }
          portfolio.cash -= value + fees;
          portfolio.feeTotal += fees;
          const pos = positionOf(portfolio, o.stockIdx);
          // 加权平均成本：把费用摊进成本，盈亏计算才真实
          pos.avgCost = (pos.avgCost * pos.qty + value + fees) / (pos.qty + qty);
          pos.qty += qty;
          filled.push({ order: o, status: 'filled', qty, price: execPrice, value, fees, side: 'buy' });
        } else {
          const pos = positionOf(portfolio, o.stockIdx);
          const fees = sellFees(value, config);
          const realized = (execPrice - pos.avgCost) * qty - fees;
          portfolio.cash += value - fees;
          portfolio.feeTotal += fees;
          pos.qty -= qty;
          release(o);
          pos.realized += realized;
          if (pos.qty === 0) pos.avgCost = 0;
          portfolio.closedTrades.push({ stockIdx: o.stockIdx, day: t, qty, price: execPrice, realized });
          filled.push({ order: o, status: 'filled', qty, price: execPrice, value, fees, side: 'sell', realized });
        }
        portfolio.trades.push({ day: t, stockIdx: o.stockIdx, side: o.side, qty, price: execPrice, value });
      }

      state.orders = kept;

      // 分红派现
      for (const div of market.world.dividends) {
        if (div.day !== t) continue;
        const pos = positionOf(portfolio, div.stockIdx);
        if (pos.qty > 0) {
          const bar = barOf(div.stockIdx, t);
          const payout = pos.qty * bar.close * div.yield / (1 - div.yield);
          portfolio.cash += payout;
          state.notices.push({
            kind: 'good',
            text: `${market.stocks[div.stockIdx].name} 派发现金红利，入账 ${payout.toFixed(2)} 元`,
          });
        }
      }

      // 现金利息（年化 1.5%，按日计提）
      portfolio.cash += portfolio.cash * (config.rules.cashRate / 252);

      const equity = currentEquity(t);
      portfolio.equityCurve.push({ day: t, equity, index: market.index[t].close });
      // 日切放在结算之后：本日买入的股票，从下一个交易日的盘前决策起才可卖出（T+1）
      startDay(portfolio);

      const result = { ok: true, day: t, filled, notices: state.notices.slice(), equity };
      state.notices = [];
      state.day += 1;
      if (state.day >= market.meta.totalDays) state.finished = true;
      return result;
    }

    function currentEquity(t) {
      let total = portfolio.cash;
      for (const pos of Object.values(portfolio.positions)) {
        if (pos.qty <= 0) continue;
        const bar = barOf(pos.stockIdx, t);
        total += pos.qty * (bar ? bar.close : 0);
      }
      return total;
    }

    return { state, placeOrder, cancelOrder, settleDay, currentEquity, positionOf, availableCash, frozenCash };
  }

  /* ------------------------------------------------------------ 结算与评级 */
  function computeScore(portfolio, market, config) {
    const last = market.meta.totalDays - 1;
    const finalEquity = portfolio.equityCurve.length
      ? portfolio.equityCurve[portfolio.equityCurve.length - 1].equity
      : config.rules.initialCash;
    const totalReturn = finalEquity / config.rules.initialCash - 1;
    const indexReturn = market.index[last].close / market.index[0].close - 1;
    const excess = totalReturn - indexReturn;

    let peak = -Infinity, maxDrawdown = 0;
    for (const p of portfolio.equityCurve) {
      peak = Math.max(peak, p.equity);
      if (peak > 0) maxDrawdown = Math.min(maxDrawdown, p.equity / peak - 1);
    }

    const closed = portfolio.closedTrades;
    const wins = closed.filter((t) => t.realized > 0).length;
    const rating = config.rating.find((r) => excess >= r.min);

    return {
      finalEquity, totalReturn, indexReturn, excess, maxDrawdown,
      winRate: closed.length ? wins / closed.length : null,
      tradeCount: portfolio.trades.length,
      feeTotal: portfolio.feeTotal,
      title: rating ? rating.title : '—',
    };
  }

  /* ------------------------------------------------------------------ 存档 */
  const SAVE_VERSION = 1;

  function serialize(seed, broker, portfolio) {
    return {
      version: SAVE_VERSION,
      seed,
      day: broker.state.day,
      finished: broker.state.finished,
      cash: portfolio.cash,
      feeTotal: portfolio.feeTotal,
      positions: portfolio.positions,
      orders: broker.state.orders,
      orderSeq: broker.state.orderSeq,
      trades: portfolio.trades,
      closedTrades: portfolio.closedTrades,
      equityCurve: portfolio.equityCurve,
      savedAt: new Date().toISOString(),
    };
  }

  function deserialize(save) {
    if (!save || save.version !== SAVE_VERSION) return null;
    return save;
  }

  return {
    CONFIG, INDUSTRIES, SAVE_VERSION,
    createRng, buildCalendar, generateWorld, simulate,
    createPortfolio, createBroker, computeScore, positionOf,
    serialize, deserialize,
    utils: { clamp, round2, buyFees, sellFees, preHolidayDays },
  };
})();
</script>

<!-- ==========================================================================
     界面层：图表、渲染与交互。所有量化逻辑都来自 GameCore，这里只负责呈现。
     ========================================================================== -->
<script id="game-ui">
(function () {
  'use strict';

  const Core = window.GameCore;
  const CONFIG = Core.CONFIG;
  const SAVE_KEY = 'stock-sim:save:v1';
  const LAST_SEED_KEY = 'stock-sim:last-seed';

  /* ------------------------------------------------------------------ 小工具 */
  const el = (id) => document.getElementById(id);
  const fmt = (v, d = 2) => Number(v).toFixed(d);
  const money = (v) => Number(v).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const signed = (v, d = 2) => `${v >= 0 ? '+' : ''}${Number(v).toFixed(d)}`;
  const pct = (v) => `${v >= 0 ? '+' : ''}${(v * 100).toFixed(2)}%`;
  const tone = (v) => (v > 0 ? 'up' : v < 0 ? 'down' : 'flat');
  const arrow = (v) => (v > 0 ? '↑' : v < 0 ? '↓' : '—');
  const escapeHtml = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /* -------------------------------------------------------------------- 状态 */
  const App = {
    seed: 0,
    world: null,
    market: null,
    portfolio: null,
    broker: null,
    selected: 0,
    orderType: 'market',
    flashTick: false,
    chartLib: false,
    klineChart: null, klineSeries: null,
    equityChart: null, equitySeries: null, indexSeries: null,
  };

  const decisionDay = () => App.broker.state.day;
  const stock = (i) => App.market.stocks[i];
  /** 玩家在决策阶段只能看到 ≤ T-1 的行情，杜绝未来函数。 */
  const visibleBars = (i) => stock(i).days.slice(0, decisionDay());
  const lastBar = (i) => {
    const bars = visibleBars(i);
    return bars.length ? bars[bars.length - 1] : null;
  };
  const refPrice = (i) => {
    const bar = lastBar(i);
    return bar ? bar.close : stock(i).price0;
  };

  /* ------------------------------------------------------------------ 提示条 */
  function toast(text, kind = '') {
    const node = document.createElement('div');
    node.className = `notice ${kind}`;
    node.textContent = text;
    el('notices').appendChild(node);
    setTimeout(() => node.remove(), 4200);
  }

  /* ------------------------------------------------------------------ 弹层 */
  function modal({ title, sub, bodyHtml, actions }) {
    const root = el('modal-root');
    root.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}">
          <div class="modal-head">
            <div class="modal-title">${escapeHtml(title)}</div>
            ${sub ? `<div class="modal-sub">${escapeHtml(sub)}</div>` : ''}
          </div>
          <div class="modal-body">${bodyHtml}</div>
          <div class="modal-foot"></div>
        </div>
      </div>`;
    const foot = root.querySelector('.modal-foot');
    for (const a of actions) {
      const btn = document.createElement('button');
      btn.className = `btn ${a.primary ? 'btn-primary' : ''}`;
      btn.textContent = a.label;
      btn.addEventListener('click', () => {
        // 弹层里的输入值必须在关闭之前取出：closeModal 会把 modal-root 整个清空，
        // 关掉之后再 getElementById 只能拿到 null。开局弹层的随机种子曾经就是这么
        // 被静默丢掉的 —— 玩家填了种子，实际仍走随机开局。
        const fields = {};
        for (const field of root.querySelectorAll('input, select')) {
          if (field.id) fields[field.id] = field.value;
        }
        closeModal();
        a.onClick?.(fields);
      });
      foot.appendChild(btn);
    }
  }
  function closeModal() { el('modal-root').innerHTML = ''; }

  /* ---------------------------------------------------------- 图表库三级加载 */
  const CHART_SOURCES = [
    // 本地优先：由 npm run web:prepare 从 node_modules 同步到 web/vendor/。
    // 用 vendor/ 而不是 node_modules/，是因为这个 HTML 是要能单独拷走的交付物，
    // 不该知道 npm 的目录结构。
    'vendor/lightweight-charts.js',
    'https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js',
    'https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js',
  ];

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = () => resolve(true);
      s.onerror = () => reject(new Error(`加载失败：${src}`));
      document.head.appendChild(s);
    });
  }

  /** 依次尝试本地 node_modules → 公网 CDN；全部失败则退回内置 Canvas 绘制。 */
  async function ensureChartLib() {
    for (const src of CHART_SOURCES) {
      try {
        await loadScript(src);
        if (window.LightweightCharts) return true;
      } catch { /* 换下一个源 */ }
    }
    return false;
  }

  /* -------------------------------------------------------- 内置 Canvas 兜底 */
  function prepCanvas(canvas) {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth || canvas.parentElement.clientWidth || 320;
    const h = canvas.clientHeight || 300;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    return { ctx, w, h };
  }

  /** 离线兜底用的极简 K 线绘制：不依赖任何外部库。 */
  function drawCandles(canvas, bars) {
    const { ctx, w, h } = prepCanvas(canvas);
    ctx.fillStyle = '#0f151d';
    ctx.fillRect(0, 0, w, h);
    if (!bars.length) {
      ctx.fillStyle = '#5d6b7b';
      ctx.font = '12px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.fillText('还没有历史行情，收盘后开始绘制', 12, 24);
      return;
    }
    const pad = { l: 10, r: 56, t: 12, b: 18 };
    const plotW = Math.max(10, w - pad.l - pad.r);
    const plotH = Math.max(10, h - pad.t - pad.b);
    const hi = Math.max(...bars.map((b) => b.high));
    const lo = Math.min(...bars.map((b) => b.low));
    const span = hi - lo || 1;
    const y = (v) => pad.t + ((hi - v) / span) * plotH;
    const cw = plotW / bars.length;

    ctx.strokeStyle = '#1b2431';
    ctx.lineWidth = 1;
    for (let g = 0; g <= 4; g++) {
      const gy = pad.t + (plotH / 4) * g;
      ctx.beginPath(); ctx.moveTo(pad.l, gy); ctx.lineTo(pad.l + plotW, gy); ctx.stroke();
    }

    bars.forEach((b, i) => {
      const x = pad.l + i * cw + cw / 2;
      const rising = b.close >= b.open;
      const color = rising ? '#d2382f' : '#0f9d63';
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.moveTo(x, y(b.high)); ctx.lineTo(x, y(b.low)); ctx.stroke();
      const bw = Math.max(1, cw * 0.62);
      const yo = y(b.open);
      const yc = y(b.close);
      ctx.fillRect(x - bw / 2, Math.min(yo, yc), bw, Math.max(1, Math.abs(yc - yo)));
    });

    const last = bars[bars.length - 1];
    ctx.fillStyle = last.close >= last.open ? '#d2382f' : '#0f9d63';
    ctx.font = '600 11px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText(fmt(last.close), pad.l + plotW + 6, y(last.close) + 4);
    ctx.fillStyle = '#5d6b7b';
    ctx.fillText('未加载图表库，使用内置简易图', pad.l, h - 5);
  }

  /** 兜底用的权益曲线（账户 vs 指数，均归一化到 100）。 */
  function drawEquity(canvas, curve, index) {
    const { ctx, w, h } = prepCanvas(canvas);
    ctx.fillStyle = '#0f151d';
    ctx.fillRect(0, 0, w, h);
    if (curve.length < 2) {
      ctx.fillStyle = '#5d6b7b';
      ctx.font = '12px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.fillText('收盘一次，这里就开始记录你的账户权益', 12, 24);
      return;
    }
    const pad = { l: 10, r: 56, t: 10, b: 16 };
    const plotW = w - pad.l - pad.r;
    const plotH = h - pad.t - pad.b;
    const base = curve[0].equity;
    const idxBase = index[0].close;
    const acct = curve.map((p) => (p.equity / base) * 100);
    const idx = index.map((p) => (p.close / idxBase) * 100);
    const all = acct.concat(idx);
    const hi = Math.max(...all);
    const lo = Math.min(...all);
    const span = hi - lo || 1;
    const x = (i, n) => pad.l + (plotW * i) / Math.max(1, n - 1);
    const y = (v) => pad.t + ((hi - v) / span) * plotH;

    const line = (vals, color, width) => {
      ctx.strokeStyle = color; ctx.lineWidth = width; ctx.beginPath();
      vals.forEach((v, i) => (i ? ctx.lineTo(x(i, vals.length), y(v)) : ctx.moveTo(x(i, vals.length), y(v))));
      ctx.stroke();
    };
    line(idx, '#4a5766', 1);
    line(acct, '#e05a4f', 2);
    ctx.fillStyle = '#8fa0b2';
    ctx.font = '600 11px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText(`${fmt(acct[acct.length - 1], 1)} / ${fmt(idx[idx.length - 1], 1)}`, pad.l + plotW + 4, pad.t + 10);
  }

  /* ---------------------------------------------------- 图表：初始化与更新 */
  function initCharts() {
    if (!App.chartLib) {
      el('kline').style.display = 'none';
      el('kline-fallback').style.display = 'block';
      el('equity').style.display = 'none';
      el('equity-fallback').style.display = 'block';
      return;
    }
    const LWC = window.LightweightCharts;
    const baseOptions = {
      // 关掉图表库的水印（版权署名保留在页面说明里），小尺寸图表上它太抢眼
      layout: { background: { color: 'transparent' }, textColor: '#8fa0b2', fontSize: 11, attributionLogo: false },
      grid: { vertLines: { color: '#1b2431' }, horzLines: { color: '#1b2431' } },
      rightPriceScale: { borderColor: '#232f3d' },
      timeScale: { borderColor: '#232f3d', timeVisible: false },
      crosshair: { mode: 0 },
      handleScale: { axisPressedMouseMove: false },
    };
    App.klineChart = LWC.createChart(el('kline'), { ...baseOptions, height: 316 });
    App.klineSeries = App.klineChart.addCandlestickSeries({
      upColor: '#d2382f', downColor: '#0f9d63',
      borderUpColor: '#d2382f', borderDownColor: '#0f9d63',
      wickUpColor: '#d2382f', wickDownColor: '#0f9d63',
    });

    App.equityChart = LWC.createChart(el('equity'), { ...baseOptions, height: 148 });
    App.indexSeries = App.equityChart.addLineSeries({ color: '#4a5766', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
    App.equitySeries = App.equityChart.addLineSeries({ color: '#e05a4f', lineWidth: 2, priceLineVisible: false });

    const resize = () => {
      App.klineChart.applyOptions({ width: el('kline').clientWidth });
      App.equityChart.applyOptions({ width: el('equity').clientWidth });
    };
    window.addEventListener('resize', resize);
    resize();
  }

  function updateCharts() {
    const sel = App.selected;
    const bars = visibleBars(sel);

    if (App.chartLib) {
      App.klineSeries.setData(bars.map((b) => ({
        time: b.date, open: b.open, high: b.high, low: b.low, close: b.close,
      })));
      const curve = App.portfolio.equityCurve;
      if (curve.length >= 1) {
        const base = curve[0].equity;
        App.equitySeries.setData(curve.map((p) => ({
          time: App.market.calendar[p.day].iso, value: (p.equity / base) * 100,
        })));
        const indexBase = App.market.index[curve[0].day].close;
        App.indexSeries.setData(curve.map((p) => ({
          time: App.market.calendar[p.day].iso, value: (App.market.index[p.day].close / indexBase) * 100,
        })));
      } else {
        App.equitySeries.setData([]);
        App.indexSeries.setData([]);
      }
      App.klineChart.timeScale().fitContent();
      App.equityChart.timeScale().fitContent();
    } else {
      drawCandles(el('kline-fallback'), bars);
      drawEquity(el('equity-fallback'), App.portfolio.equityCurve, App.market.index);
    }
  }

  /* ------------------------------------------------------------------ 渲染 */
  function renderTicker() {
    const day = decisionDay();
    const idx = App.market.index;
    const idxNow = day > 0 ? idx[day - 1].close : idx[0].close;
    const idxPrev = day > 1 ? idx[day - 2].close : idx[0].open;
    const idxChg = idxNow / idxPrev - 1;

    const equity = day > 0
      ? App.portfolio.equityCurve[App.portfolio.equityCurve.length - 1].equity
      : CONFIG.rules.initialCash;
    const prevEquity = day > 1 ? App.portfolio.equityCurve[App.portfolio.equityCurve.length - 2].equity : CONFIG.rules.initialCash;
    const dayPnl = equity - prevEquity;

    const dateLabel = day < CONFIG.time.tradingDays ? App.market.calendar[day].label : '已收盘';
    // 顶栏那条 3px 细线跟着大盘走
    document.documentElement.style.setProperty(
      '--index-tone', idxChg > 0 ? 'var(--up)' : idxChg < 0 ? 'var(--down)' : 'var(--flat)',
    );

    el('ticker').innerHTML = `
      <div class="tick tick-day"><span class="tick-label">交易日</span><span class="tick-value">${Math.min(day + 1, CONFIG.time.tradingDays)}/${CONFIG.time.tradingDays}</span></div>
      <div class="tick tick-date"><span class="tick-label">日期</span><span class="tick-value">${escapeHtml(dateLabel)}</span></div>
      <div class="tick tick-index"><span class="tick-label">${CONFIG.index.name}</span><span class="tick-value ${tone(idxChg)}">${fmt(idxNow, 1)} ${arrow(idxChg)}${pct(idxChg)}</span></div>
      <div class="tick tick-equity"><span class="tick-label">总资产</span><span class="tick-value">${money(equity)}</span></div>
      <div class="tick tick-pnl"><span class="tick-label">今日盈亏</span><span class="tick-value ${tone(dayPnl)}">${signed(dayPnl)}</span></div>`;
    el('day-label').textContent = `第 ${Math.min(day + 1, CONFIG.time.tradingDays)} / ${CONFIG.time.tradingDays} 个交易日`;
  }

  function renderAccount() {
    const day = decisionDay();
    const equity = day > 0 ? App.portfolio.equityCurve[App.portfolio.equityCurve.length - 1].equity : CONFIG.rules.initialCash;
    let marketValue = 0;
    let costValue = 0;
    for (const pos of Object.values(App.portfolio.positions)) {
      if (pos.qty <= 0) continue;
      const bar = lastBar(pos.stockIdx);
      const price = bar ? bar.close : stock(pos.stockIdx).price0;
      marketValue += pos.qty * price;
      costValue += pos.qty * pos.avgCost;
    }
    const floatPnl = marketValue - costValue;
    const totalPnl = equity - CONFIG.rules.initialCash;

    // 可用现金要扣掉挂单冻结；冻结非零时单列一格，让「下单即扣」看得见
    const frozen = App.broker.frozenCash();
    const frozenCell = frozen > 0.005
      ? `<div class="acct-cell"><span class="acct-label">挂单冻结</span><span class="acct-value" style="color:var(--text-dim)">${money(frozen)}</span></div>`
      : '';

    el('account-grid').innerHTML = `
      <div class="acct-cell wide"><span class="acct-label">总资产</span><span class="acct-value big ${tone(totalPnl)}">${money(equity)}</span></div>
      <div class="acct-cell"><span class="acct-label">累计收益</span><span class="acct-value ${tone(totalPnl)}">${signed(totalPnl)} (${pct(totalPnl / CONFIG.rules.initialCash)})</span></div>
      <div class="acct-cell"><span class="acct-label">可用现金</span><span class="acct-value">${money(App.broker.availableCash())}</span></div>
      ${frozenCell}
      <div class="acct-cell"><span class="acct-label">持仓市值</span><span class="acct-value">${money(marketValue)}</span></div>
      <div class="acct-cell"><span class="acct-label">持仓浮盈</span><span class="acct-value ${tone(floatPnl)}">${signed(floatPnl)}</span></div>
      <div class="acct-cell"><span class="acct-label">累计费用</span><span class="acct-value" style="color:var(--text-dim)">${money(App.portfolio.feeTotal)}</span></div>`;

    const held = Object.values(App.portfolio.positions).filter((p) => p.qty > 0);
    el('position-summary').textContent = held.length ? `${held.length} 只` : '空仓';
  }

  function renderPositions() {
    const held = Object.values(App.portfolio.positions).filter((p) => p.qty > 0);
    if (!held.length) {
      el('positions').innerHTML = '<div class="empty">还没有持仓。<br>在下面的行情里挑一只，填好数量点「买入」。</div>';
      return;
    }
    const rows = held.map((pos) => {
      const s = stock(pos.stockIdx);
      const price = lastBar(pos.stockIdx)?.close ?? s.price0;
      const pnl = (price - pos.avgCost) * pos.qty;
      const pnlPct = pos.avgCost > 0 ? price / pos.avgCost - 1 : 0;
      return `<tr data-stock="${pos.stockIdx}" class="${pos.stockIdx === App.selected ? 'is-active' : ''}">
        <td><span class="stock-name">${escapeHtml(s.name)}${s.st ? '<span class="board-tag st">ST</span>' : ''}</span><span class="stock-code">${s.code}</span></td>
        <td class="num">${pos.qty}<span class="cell-sub">可卖 ${pos.available}</span></td>
        <td class="num">${fmt(price)}<span class="cell-sub">成本 ${fmt(pos.avgCost)}</span></td>
        <td class="num ${tone(pnl)}">${signed(pnl)}<span class="cell-sub ${tone(pnlPct)}">${pct(pnlPct)}</span></td>
      </tr>`;
    }).join('');
    el('positions').innerHTML = `<table class="grid">
      <thead><tr><th>名称</th><th>持仓</th><th>现价</th><th>盈亏</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  }

  function renderMarketList() {
    const day = decisionDay();
    // 只有收盘结算之后的那一次渲染才播放价格闪动
    const flash = App.flashTick;
    App.flashTick = false;

    const rows = App.market.stocks.map((s) => {
      const bar = lastBar(s.index);
      const price = bar ? bar.close : s.price0;
      const prev = bar ? bar.prevClose : s.price0;
      const chg = price / prev - 1;
      const boardTag = s.board === 'star' ? '<span class="board-tag star">科创</span>'
        : s.board === 'growth' ? '<span class="board-tag growth">创业</span>' : '';
      const stTag = s.st ? '<span class="board-tag st">ST</span>' : '';
      // 左缘色条只在涨跌幅超过 3% 时出现：它在说"今天这只票不寻常"
      const move = bar && Math.abs(chg) >= 0.03 ? (chg > 0 ? 'is-move-up' : 'is-move-down') : '';
      const tick = flash && bar && Math.abs(chg) >= 0.01 ? (chg > 0 ? 'tick-up' : 'tick-down') : '';
      const active = s.index === App.selected ? 'is-active' : '';
      return `<tr data-stock="${s.index}" class="${[active, move, tick].filter(Boolean).join(' ')}">
        <td><span class="stock-name">${escapeHtml(s.name)}${stTag}${boardTag}</span><span class="stock-code">${s.code} ${escapeHtml(s.industry)}</span></td>
        <td><span class="chg-pill ${tone(chg)}">${fmt(price)} ${arrow(chg)}${pct(chg)}</span></td>
      </tr>`;
    }).join('');
    el('market-list').innerHTML = `<table class="grid">
      <thead><tr><th>名称</th><th>最新价 / 涨跌</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
    el('list-hint').textContent = day === 0 ? '开盘前' : `截至 ${App.market.calendar[day - 1].label}`;
  }

  function renderChartHead() {
    const s = stock(App.selected);
    const bar = lastBar(App.selected);
    const price = bar ? bar.close : s.price0;
    const prev = bar ? bar.prevClose : s.price0;
    const chg = price / prev - 1;
    el('chart-title').textContent = `${s.name} ${s.code}`;
    el('chart-price').className = `chart-price ${tone(chg)}`;
    el('chart-price').textContent = `${fmt(price)} ${arrow(chg)}${pct(chg)}`;
    const limit = s.st ? CONFIG.boards.st : s.limit;
    el('chart-meta').innerHTML = [
      s.industry,
      `涨跌停 ±${(limit * 100).toFixed(0)}%`,
      s.st ? 'ST 特别处理' : null,
      bar ? `成交 ${(bar.amount / 1e8).toFixed(2)} 亿` : '尚无成交',
    ].filter(Boolean).map((t) => `<span class="meta-chip">${escapeHtml(t)}</span>`).join('');

    const notice = el('chart-notice');
    if (decisionDay() === 0) {
      notice.innerHTML = '<div class="fallback-note">开盘前：今天收盘后才会产生第一根 K 线。你可以先读消息面，再决定买入。</div>';
    } else {
      notice.innerHTML = '';
    }
  }

  /**
   * 快捷数量的判断口径：选中标的还有可卖的股票就按持仓算（卖出），
   * 否则按可用现金算（买入）。没有加方向切换控件，靠这一条自动判别。
   */
  const presetMode = (pos) => (pos.available > 0 ? 'holding' : 'cash');

  function renderTrade() {
    const s = stock(App.selected);
    const price = refPrice(App.selected);
    const pos = Core.positionOf(App.portfolio, App.selected);
    el('trade-hint').textContent = `参考价 ${fmt(price)}（${lastBar(App.selected) ? '昨收' : '发行价'}）`;

    // 把快捷数量的口径明写出来，免得玩家点了「全仓」才发现算的是卖出
    const presetNote = presetMode(pos) === 'holding'
      ? `可卖 ${pos.available} 股；快捷数量按持仓算`
      : `可用 ${money(App.broker.availableCash())} 元；快捷数量按可用现金算`;

    const qty = Number(el('trade-qty').value) || 0;
    if (App.orderType === 'market') {
      const est = qty * price;
      const fee = Core.utils.buyFees(est, CONFIG);
      el('qty-estimate').textContent = qty > 0
        ? `预计金额 ≈ ${money(est)} 元（含费用约 ${fmt(fee)} 元）；${presetNote}`
        : presetNote;
    } else {
      const lp = Number(el('trade-limit').value) || 0;
      el('qty-estimate').textContent = lp > 0 ? `限价 ${fmt(lp)}，触及才成交；${presetNote}` : presetNote;
    }
  }

  function renderOrders() {
    const orders = App.broker.state.orders;
    el('order-hint').textContent = orders.length ? `${orders.length} 笔待成交` : '无';
    if (!orders.length) {
      el('orders').innerHTML = '<div class="empty">当前没有挂单。市价单会在点击「收盘结算」时按当日收盘价成交。</div>';
      return;
    }
    const rows = orders.map((o) => {
      const s = stock(o.stockIdx);
      const side = o.side === 'buy' ? '<span class="up">买入</span>' : '<span class="down">卖出</span>';
      const type = o.type === 'market' ? '市价' : `限价 ${fmt(o.limitPrice)}`;
      return `<tr>
        <td><span class="stock-name">${escapeHtml(s.name)}</span><span class="stock-code">${s.code}</span></td>
        <td>${side}</td><td>${type}</td><td class="num">${o.qty}</td>
        <td class="num" style="color:var(--text-dim)">${o.type === 'limit' ? `${o.remainingDays} 日` : '—'}</td>
        <td><button class="btn btn-sm" data-cancel="${o.id}">撤单</button></td>
      </tr>`;
    }).join('');
    el('orders').innerHTML = `<table class="grid">
      <thead><tr><th>标的</th><th>方向</th><th>类型</th><th>数量</th><th>剩余</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  }

  /**
   * 消息面：当天 + 上一天。
   *
   * 只显示当天会丢线索：前一天的公告往往正是当天走势的解释，而玩家读完
   * 昨天的消息、点了结算，再回来看就没了。所以把上一天保留下来，
   * 用变淡 + 一条「昨日」分隔做视觉降级，当天的仍是主角。
   */
  function renderNews() {
    const day = decisionDay();
    const items = App.market.news[day] ?? [];
    const past = day > 0 ? (App.market.news[day - 1] ?? []) : [];
    const total = items.length + past.length;
    el('news-count').textContent = total ? `${total} 条` : '暂无';

    if (!total) {
      el('news').innerHTML = '<div class="empty">今天盘前没有新消息。</div>';
      return;
    }

    const block = (list, isPast) => list.map((n) => {
      const tagKind = n.rumor ? 'rumor' : n.tone === 'bad' ? 'bad' : n.tone === 'good' ? 'good' : '';
      const tagText = n.rumor ? '传闻' : n.scope === 'market' ? '宏观' : n.scope === 'industry' ? '行业' : n.scope === 'stock' ? '公司' : '快讯';
      let text = escapeHtml(n.headline);
      if (n.stockIdx !== null && n.stockIdx !== undefined) {
        const name = escapeHtml(stock(n.stockIdx).name);
        text = text.replace(name, `<span class="sym">${name}</span>`);
      }
      return `<div class="news-item${isPast ? ' is-past' : ''}">
        <div class="news-tags"><span class="news-tag ${tagKind}">${tagText}</span></div>
        <div class="news-text">${text}</div>
      </div>`;
    }).join('');

    let html = items.length ? block(items, false) : '<div class="empty">今天盘前没有新消息。</div>';
    if (past.length) {
      const label = App.market.calendar?.[day - 1]?.label ?? '';
      html += `<div class="news-sep">昨日 · ${escapeHtml(label)}（保留）</div>`;
      html += block(past, true);
    }
    el('news').innerHTML = html;
  }

  function renderEmotion() {
    const day = decisionDay();
    const value = day === 0 ? App.market.emotion[0] : App.market.emotion[day - 1];
    const label = value >= 80 ? '狂热' : value >= 62 ? '活跃' : value >= 38 ? '平静' : value >= 20 ? '低迷' : '冰点';
    el('emotion-value').textContent = fmt(value, 1);
    el('emotion-label').textContent = label;
    el('emotion-fill').style.width = `${value}%`;
    const note = value >= 80 ? '情绪过热，追高的风险在放大。'
      : value <= 20 ? '情绪冰点，恐慌里往往藏着机会。'
      : '情绪处于常态区间，跟着消息和基本面走。';
    el('emotion-note').textContent = note;
  }

  function renderAll() {
    renderTicker();
    renderAccount();
    renderPositions();
    renderMarketList();
    renderChartHead();
    renderTrade();
    renderOrders();
    renderNews();
    renderEmotion();
    updateCharts();
    el('btn-next').disabled = App.broker.state.finished;
    el('btn-next').textContent = App.broker.state.finished ? '本局已结束' : '收盘结算';
  }

  /* ------------------------------------------------------------------ 存档 */
  function persist() {
    if (!App.broker) return;
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(Core.serialize(App.seed, App.broker, App.portfolio)));
    } catch { /* 隐私模式下 localStorage 可能不可用 */ }
  }

  function restore() {
    let save;
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return false;
      save = JSON.parse(raw);
    } catch { return false; }

    const data = Core.deserialize(save);
    if (!data) { toast('存档版本不兼容，已忽略并重新开局', 'bad'); return false; }

    App.seed = data.seed;
    App.world = Core.generateWorld(App.seed);
    App.market = Core.simulate(App.world);
    App.portfolio = Core.createPortfolio(data.cash);
    App.portfolio.feeTotal = data.feeTotal ?? 0;
    App.portfolio.positions = data.positions ?? {};
    App.portfolio.trades = data.trades ?? [];
    App.portfolio.closedTrades = data.closedTrades ?? [];
    App.portfolio.equityCurve = data.equityCurve ?? [];
    App.broker = Core.createBroker(App.portfolio, App.market, CONFIG);
    App.broker.state.day = data.day ?? 0;
    App.broker.state.orders = data.orders ?? [];
    App.broker.state.orderSeq = data.orderSeq ?? 1;
    App.broker.state.finished = !!data.finished;
    return true;
  }

  /* ------------------------------------------------------------------ 开局 */
  function newGame(seed) {
    App.seed = seed >>> 0;
    App.world = Core.generateWorld(App.seed);
    App.market = Core.simulate(App.world);
    App.portfolio = Core.createPortfolio(CONFIG.rules.initialCash);
    App.broker = Core.createBroker(App.portfolio, App.market, CONFIG);
    App.selected = 0;
    try { localStorage.setItem(LAST_SEED_KEY, String(App.seed)); } catch { /* 忽略 */ }
    persist();
    renderAll();
  }

  function showIntro() {
    const lastSeed = (() => { try { return localStorage.getItem(LAST_SEED_KEY); } catch { return null; } })();
    modal({
      title: '股市模拟',
      sub: '45 个交易日 · 初始资金 10 万元',
      bodyHtml: `
        <p style="margin:0 0 14px">你是一名普通股民，手里有 10 万元。接下来 45 个交易日，你能依靠的只有公开消息和自己的判断。</p>
        <div class="modal-highlight" style="margin-top:0">
          <div class="score-row"><span class="score-key">成交方式</span><span class="score-val plain">市价按当日收盘价，限价按当日最低/最高触发</span></div>
          <div class="score-row"><span class="score-key">T+1</span><span class="score-val plain">当日买入，次日才可卖</span></div>
          <div class="score-row"><span class="score-key">涨跌停</span><span class="score-val plain">主板 ±10%，创业板与科创板 ±20%</span></div>
          <div class="score-row"><span class="score-key">交易成本</span><span class="score-val plain">佣金万 2.5（最低 5 元）+ 印花税 + 滑点</span></div>
          <div class="score-row"><span class="score-key">结算评级</span><span class="score-val plain">相对华夏综指的超额收益</span></div>
        </div>
        <p class="hint" style="margin:14px 0 18px">涨停买不进，跌停卖不出。全部股票名称与代码均为虚构，不对应任何真实公司。</p>
        <div class="field" style="margin-bottom:0">
          <label for="seed-input">随机种子：相同种子产生完全相同的行情，方便复盘</label>
          <input id="seed-input" type="number" value="${lastSeed ?? Math.floor(Math.random() * 1e8)}" inputmode="numeric">
        </div>`,
      actions: [
        { label: '读取上次存档', onClick: () => { if (!restore()) { toast('没有可用的存档', 'bad'); showIntro(); } else renderAll(); } },
        {
          label: '开始新的 45 天', primary: true, onClick: (fields) => {
            // 种子由 modal 在关闭弹层前取出并传进来（见 modal 内的说明）
            const v = Number(fields['seed-input']);
            newGame(Number.isFinite(v) && v > 0 ? v : Math.floor(Math.random() * 1e8));
            toast('开局成功，先读消息面再动手', 'good');
          },
        },
      ],
    });
  }

  function showSettlement() {
    const score = Core.computeScore(App.portfolio, App.market, CONFIG);
    const row = (k, v, cls = '') => `<div class="score-row"><span class="score-key">${k}</span><span class="score-val ${cls}">${v}</span></div>`;
    modal({
      title: `结算 · ${score.title}`,
      sub: `45 个交易日结束 · 随机种子 ${App.seed}`,
      bodyHtml: `
        <div class="modal-highlight" style="margin-top:0">
          ${row('期末总资产', money(score.finalEquity))}
          ${row('总收益率', pct(score.totalReturn), tone(score.totalReturn))}
          ${row(`${CONFIG.index.name}同期`, pct(score.indexReturn), tone(score.indexReturn))}
          ${row('相对基准超额', pct(score.excess), tone(score.excess))}
        </div>
        ${row('最大回撤', pct(score.maxDrawdown), 'down')}
        ${row('交易次数', `${score.tradeCount} 次`)}
        ${row('胜率', score.winRate === null ? '没有平仓交易' : pct(score.winRate))}
        ${row('累计交易成本', `${money(score.feeTotal)} 元`, 'down')}
        <p class="hint" style="margin:14px 0 0">交易成本不产生任何收益，却每天都在扣钱。它是散户最容易被忽略的那个对手。</p>`,
      actions: [
        { label: '用同一种子再来一次', onClick: () => newGame(App.seed) },
        { label: '换个种子重开', primary: true, onClick: () => newGame(Math.floor(Math.random() * 1e8)) },
      ],
    });
  }

  /* ------------------------------------------------------------------ 交互 */
  function placeOrder(side) {
    if (App.broker.state.finished) { toast('本局已结束', 'bad'); return; }
    const qty = Number(el('trade-qty').value) || 0;
    const req = { stockIdx: App.selected, side, type: App.orderType, qty };
    if (App.orderType === 'limit') {
      req.limitPrice = Number(el('trade-limit').value);
      req.validity = Number(el('trade-validity').value);
    }
    const res = App.broker.placeOrder(req);
    if (!res.ok) { toast(res.reason, 'bad'); return; }
    const s = stock(App.selected);
    toast(`已挂单：${side === 'buy' ? '买入' : '卖出'} ${s.name} ${res.order.qty} 股`, 'good');
    persist();
    renderAll();
  }

  function nextDay() {
    if (App.broker.state.finished) return;
    const day = decisionDay();
    const res = App.broker.settleDay();
    if (!res.ok) { toast(res.reason, 'bad'); return; }

    for (const f of res.filled) {
      const s = stock(f.order.stockIdx);
      if (f.status === 'filled') {
        toast(`${s.name} ${f.side === 'buy' ? '买入' : '卖出'}成交 ${f.qty} 股 @ ${fmt(f.price)}`, 'good');
      } else if (f.status === 'rejected') {
        toast(`${s.name} ${f.reason}`, 'bad');
      } else if (f.status === 'expired') {
        toast(`${s.name} ${f.reason}`);
      }
    }
    for (const n of res.notices) toast(n.text, n.kind);

    if (App.broker.state.finished) {
      persist();
      renderAll();
      showSettlement();
      return;
    }
    App.flashTick = true;   // 让刚结算的这一天的价格变化闪一下
    persist();
    renderAll();
  }

  function bindEvents() {
    // 选中股票（事件委托，覆盖持仓表与行情表）
    document.addEventListener('click', (e) => {
      const row = e.target.closest('tr[data-stock]');
      if (row) {
        App.selected = Number(row.dataset.stock);
        renderAll();
        return;
      }
      const cancel = e.target.closest('button[data-cancel]');
      if (cancel) {
        const res = App.broker.cancelOrder(Number(cancel.dataset.cancel));
        toast(res.ok ? '已撤单' : res.reason, res.ok ? '' : 'bad');
        persist();
        renderAll();
      }
    });

    el('btn-buy').addEventListener('click', () => placeOrder('buy'));
    el('btn-sell').addEventListener('click', () => placeOrder('sell'));
    el('btn-next').addEventListener('click', nextDay);

    el('trade-qty').addEventListener('input', renderTrade);
    el('trade-limit').addEventListener('input', renderTrade);

    el('order-type').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-type]');
      if (!btn) return;
      App.orderType = btn.dataset.type;
      for (const b of el('order-type').children) b.classList.toggle('on', b === btn);
      el('limit-field').style.display = App.orderType === 'limit' ? '' : 'none';
      el('validity-field').style.display = App.orderType === 'limit' ? '' : 'none';
      renderTrade();
    });

    /**
     * 快捷数量：按选中标的的持仓自动判方向。
     *   有可卖持仓 → 按持仓算（半仓 = 可卖的一半，全仓 = 全部可卖）
     *   没有持仓   → 按可用现金算（半仓 = 一半可用现金能买多少，全仓 = 全买）
     * 这样卖出时也能用快捷数量，不必自己数持仓股数。
     */
    el('qty-presets').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-qty]');
      if (!btn) return;
      const price = refPrice(App.selected);
      const lot = CONFIG.rules.lotSize;
      const pos = Core.positionOf(App.portfolio, App.selected);
      const holding = presetMode(pos) === 'holding';
      const avail = App.broker.availableCash();

      let qty;
      if (btn.dataset.qty === 'hf') {
        qty = holding
          ? Math.floor((pos.available / 2) / lot) * lot
          : Math.floor((avail / 2) / price / lot) * lot;
      } else if (btn.dataset.qty === 'all') {
        qty = holding
          ? Math.floor(pos.available / lot) * lot
          : Math.floor(avail / (price * 1.01) / lot) * lot;
      } else {
        qty = Number(btn.dataset.qty);
      }
      el('trade-qty').value = Math.max(lot, qty || lot);
      renderTrade();
    });

    el('btn-save').addEventListener('click', () => { persist(); toast('已存档到浏览器本地', 'good'); });
    el('btn-load').addEventListener('click', () => {
      if (restore()) { renderAll(); toast('已读取存档', 'good'); }
      else toast('没有可用的存档', 'bad');
    });
    el('btn-restart').addEventListener('click', () => {
      modal({
        title: '重新开局',
        sub: '当前进度将被清空',
        bodyHtml: '<p style="margin:0">用同一种子可以复盘完全相同的行情；换个种子则是全新的市场。</p>',
        actions: [
          { label: '取消' },
          { label: '同一种子重开', onClick: () => newGame(App.seed) },
          { label: '换新种子', primary: true, onClick: () => newGame(Math.floor(Math.random() * 1e8)) },
        ],
      });
    });

    // 移动端标签切换
    el('mobile-tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-tab]');
      if (!btn) return;
      for (const b of el('mobile-tabs').children) b.classList.toggle('on', b === btn);
      for (const p of document.querySelectorAll('.panel')) {
        p.classList.toggle('is-shown', p.dataset.tab === btn.dataset.tab);
      }
    });

    // 离开页面前兜底存档
    document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); });
    window.addEventListener('pagehide', persist);

    // 键盘快捷键：B 买入 / S 卖出 / 空格结算
    document.addEventListener('keydown', (e) => {
      if (e.target.matches('input, select, textarea')) return;
      if (e.key === 'b' || e.key === 'B') placeOrder('buy');
      else if (e.key === 's' || e.key === 'S') placeOrder('sell');
      else if (e.key === ' ') { e.preventDefault(); nextDay(); }
    });
  }

  /* ------------------------------------------------------------------ 启动 */
  async function boot() {
    App.chartLib = await ensureChartLib();
    initCharts();
    bindEvents();

    if (!restore()) {
      // 没有存档：先铺一个初始局面作为背景，再弹开局说明
      App.seed = 20260101;
      App.world = Core.generateWorld(App.seed);
      App.market = Core.simulate(App.world);
      App.portfolio = Core.createPortfolio(CONFIG.rules.initialCash);
      App.broker = Core.createBroker(App.portfolio, App.market, CONFIG);
      renderAll();
      showIntro();
    } else {
      renderAll();
      toast('已恢复上次的存档', 'good');
    }

    if (!App.chartLib) {
      toast('未能加载图表库（离线且无本地依赖），已切换为内置简易图', '');
    }
  }

  boot();
})();
</script>

</body>
</html>
