<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>股市模拟 · 45 个交易日</title>
<style>
/* ==========================================================================
   设计令牌：色彩语义遵循中国股市习惯（红涨绿跌）
   ========================================================================== */
:root {
  /* 大厅：明亮、克制，承载账户与消息 */
  --bg:            #e7ebf0;
  --bg-raised:     #ffffff;
  --bg-sunken:     #f1f4f8;
  --line:          #d5dce4;
  --line-soft:     #e7ecf2;
  --text:          #18202a;
  --text-dim:      #5d6875;
  --text-faint:    #8b95a2;

  /* 行情屏：深色、密集，承载价格与交易 */
  --screen:        #0f151d;
  --screen-2:      #151d27;
  --screen-sunken: #0b1017;
  --screen-line:   #232f3d;
  --screen-soft:   #1b2431;
  --screen-text:   #e8eef5;
  --screen-dim:    #8fa0b2;
  --screen-faint:  #5d6b7b;

  /* 涨跌：红涨绿跌，中国股市的习惯 */
  --up:            #d2382f;
  --up-soft:       rgba(210,56,47,.12);
  --down:          #0f9d63;
  --down-soft:     rgba(15,157,99,.12);
  --flat:          #8b95a2;

  /* 强调色与"涨"同色：在这个世界里，红色就是好 */
  --accent:        #d2382f;
  --accent-soft:   rgba(210,56,47,.10);
  --info:          #2f6fb5;
  --danger:        #b32b23;

  --space-1: 4px;  --space-2: 8px;  --space-3: 12px;
  --space-4: 16px; --space-5: 24px; --space-6: 32px;

  --fs-xs: 11px; --fs-sm: 12px; --fs-md: 13.5px;
  --fs-lg: 15px; --fs-xl: 20px; --fs-2xl: 28px;

  /* 圆角按层级变化，而不是一个圆角走天下 */
  --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px;
  --font-ui: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, -apple-system, "Segoe UI", sans-serif;
  /* 数字沿用同一套字体 + 等宽数字，不额外引入等宽族 */
  --font-num: var(--font-ui);
  --shadow: 0 2px 10px rgba(24,32,42,.09);
  --shadow-screen: 0 16px 38px rgba(15,21,29,.28), inset 0 1px 0 rgba(255,255,255,.06);

  /* 顶栏那条 3px 细线的颜色随大盘涨跌变化，由 JS 写入 */
  --index-tone: var(--flat);
}

/* 同一套组件类，靠作用域变量切换材质：浅色是大厅，深色是行情屏 */
.screen {
  /* 必须显式设置 color：只改变量不会改变从 body 继承下来的文字颜色 */
  color: var(--screen-text);
  --bg:          var(--screen);
  --bg-raised:   var(--screen-2);
  --bg-sunken:   var(--screen-sunken);
  --line:        var(--screen-line);
  --line-soft:   var(--screen-soft);
  --text:        var(--screen-text);
  --text-dim:    var(--screen-dim);
  --text-faint:  var(--screen-faint);
  --accent:      #e05a4f;
  /* 深色屏上的选中底不能用红色泛光，会发浑；改成一层淡淡的白 */
  --accent-soft: rgba(255,255,255,.07);
}
/* 单元格里的次要信息（可卖 / 成本 / 盈亏比例）走第二行，避免表格横向挤爆 */
.cell-sub { display: block; font-size: var(--fs-xs); color: var(--text-faint); font-weight: 400; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  /* 大厅顶部的环境光：极淡，只为让浅色底不显得死板 */
  background-image: radial-gradient(1100px 380px at 50% -12%, rgba(255,255,255,.8), transparent 72%);
  background-repeat: no-repeat;
  color: var(--text);
  font: var(--fs-md)/1.6 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 2px; }

/* 数字表格对齐，价格列才会严格对齐 */
.num, td.num, .mono { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.up   { color: var(--up); }
.down { color: var(--down); }
.flat { color: var(--flat); }

/* ==========================================================================
   顶栏：品牌 / 行情条 / 操作
   ========================================================================== */
.topbar {
  display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-3) var(--space-4);
  background: var(--bg-raised);
  /* 顶边这条 3px 细线的颜色跟着大盘走：红=涨、绿=跌、灰=平 */
  border-top: 3px solid var(--index-tone);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 30;
}
.brand { display: flex; flex-direction: column; line-height: 1.15; }
.brand-name { font-size: var(--fs-xl); font-weight: 800; letter-spacing: -.01em; }
.brand-sub { font-size: var(--fs-xs); color: var(--text-faint); }
.ticker { display: flex; flex-wrap: wrap; gap: var(--space-5); margin-left: auto; }
.tick { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2; }
.tick-label { font-size: var(--fs-xs); color: var(--text-faint); }
.tick-value { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: var(--fs-lg); font-weight: 700; }
.topbar-actions { display: flex; gap: var(--space-2); }
.btn {
  background: var(--bg-raised); border: 1px solid var(--line);
  color: var(--text-dim); padding: 6px 12px; border-radius: var(--radius-sm);
  transition: border-color .12s, color .12s, background .12s;
}
.btn:hover { border-color: var(--text-dim); color: var(--text); background: var(--bg-sunken); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn:disabled:hover { border-color: var(--line); color: var(--text-dim); background: var(--bg-raised); }
/* 主行动用墨色实底，把红色留给"买入"这类语义色 */
.btn-primary { background: #18202a; border-color: #18202a; color: #fff; font-weight: 600; }
.btn-primary:hover { background: #2b3745; border-color: #2b3745; color: #fff; }
.btn-buy { background: var(--up); border-color: var(--up); color: #fff; font-weight: 600; }
.btn-buy:hover { background: #b62f27; border-color: #b62f27; color: #fff; }
.btn-sell { background: var(--down); border-color: var(--down); color: #fff; font-weight: 600; }
.btn-sell:hover { background: #0c8453; border-color: #0c8453; color: #fff; }
.btn-sm { padding: 3px 8px; font-size: var(--fs-xs); }

/* ==========================================================================
   布局：桌面三栏 / 移动端单选
   ========================================================================== */
.layout {
  display: grid; gap: 14px; padding: 14px;
  grid-template-columns: minmax(272px, 320px) minmax(0, 1fr) minmax(288px, 348px);
  align-items: start;
}
/* 网格子项默认 min-width:auto，会把 nowrap 的表格顶出容器造成横向溢出 */
.layout > .panel { min-width: 0; }
/* 左栏两块可滚动区域都限高，行情板才不会被挤到折叠线以下 */
#positions { max-height: 28vh; overflow-y: auto; }
#orders { max-height: 22vh; overflow-y: auto; }
/* 大厅里的面板：平铺、无阴影，靠边线与留白分区 */
.panel {
  background: var(--bg-raised); border: 1px solid var(--line);
  border-radius: var(--radius-md); overflow: hidden;
}
/* 行情屏：整块浮起来，阴影只留给它 */
.panel.screen {
  border-radius: var(--radius-lg);
  border-color: var(--screen-line);
  box-shadow: var(--shadow-screen);
}
.panel-head {
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-2);
  padding: 10px var(--space-3);
  border-bottom: 1px solid var(--line-soft);
}
.panel-title { font-size: var(--fs-sm); color: var(--text-dim); font-weight: 600; }
.panel-body { padding: var(--space-3); }
.panel-body.tight { padding: var(--space-2); }
.scroll { overflow-y: auto; }
.mobile-tabs { display: none; }

/* 深色图表框：K 线与权益曲线共用一个屏面 */
.screen-frame {
  background: var(--screen); border: 1px solid var(--screen-line);
  border-radius: var(--radius-md); padding: 10px 10px 6px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
}
.chart-caption {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px;
  font-size: var(--fs-xs); color: var(--screen-faint);
  margin: 10px 0 2px; padding-top: 8px; border-top: 1px solid var(--screen-soft);
}
.chart-credit { color: #46525f; }

/* ==========================================================================
   账户卡片 / 持仓表
   ========================================================================== */
.acct-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
.acct-cell { display: flex; flex-direction: column; gap: 1px; }
.acct-cell.wide { grid-column: 1 / -1; }
.acct-label { font-size: var(--fs-xs); color: var(--text-faint); }
.acct-value { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: var(--fs-lg); font-weight: 700; }
.acct-value.big { font-size: var(--fs-2xl); font-weight: 800; letter-spacing: -.02em; }

table.grid { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
table.grid th {
  text-align: right; font-weight: 500; color: var(--text-faint);
  font-size: var(--fs-xs); padding: var(--space-1) var(--space-2);
  border-bottom: 1px solid var(--line-soft); white-space: nowrap;
}
table.grid th:first-child, table.grid td:first-child { text-align: left; }
table.grid td { text-align: right; padding: var(--space-2); border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
table.grid tbody tr { cursor: pointer; }
table.grid tbody tr:hover { background: rgba(128,140,155,.10); }
table.grid tbody tr.is-active { background: var(--accent-soft); }
table.grid tbody tr.is-active td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
table.grid tbody tr:last-child td { border-bottom: 0; }
.stock-name { display: block; font-weight: 600; }
.stock-code { display: block; font-size: var(--fs-xs); color: var(--text-faint); }
.board-tag {
  font-size: 10px; padding: 0 4px; border-radius: var(--radius-sm); margin-left: 4px;
  border: 1px solid var(--line); color: var(--text-faint); vertical-align: 1px;
}
.board-tag.growth { border-color: var(--tag-a); color: var(--tag-a); }
.board-tag.star { border-color: var(--tag-b); color: var(--tag-b); }
.board-tag.st { border-color: var(--danger); color: var(--danger); }

/* 行情大屏：整页唯一一块深色区域，是这套设计的记忆点 */
.market-table { max-height: 36vh; overflow-y: auto; }
.market-table.screen {
  background: var(--screen);
  border-radius: var(--radius-md);
  padding: 4px 2px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
}
.market-table .grid td { padding: 7px var(--space-3); border-bottom-color: var(--screen-soft); }
.market-table .grid tbody tr:hover { background: rgba(255,255,255,.05); }
.market-table .stock-name { font-size: var(--fs-md); }
.market-table .stock-code { color: var(--screen-faint); }
.chg-pill {
  display: inline-block; min-width: 96px; text-align: right;
  font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 700; font-size: var(--fs-md);
}

/* 异动标记：左缘色条只在涨跌幅超过 3% 时出现，编码"这只票今天不寻常" */
#market-list tbody tr.is-move-up { box-shadow: inset 3px 0 0 var(--up); }
#market-list tbody tr.is-move-down { box-shadow: inset 3px 0 0 var(--down); }

/* 收盘结算后，价格真正变化过的行闪一下——只在有意义的时候动 */
@keyframes tick-up   { from { background: var(--up-soft); }   to { background: transparent; } }
@keyframes tick-down { from { background: var(--down-soft); } to { background: transparent; } }
#market-list tbody tr.tick-up   { animation: tick-up .8s ease-out; }
#market-list tbody tr.tick-down { animation: tick-down .8s ease-out; }

/* ==========================================================================
   图表区
   ========================================================================== */
.chart-head { display: flex; align-items: baseline; gap: var(--space-3); flex-wrap: wrap; }
.chart-title { font-size: var(--fs-xl); font-weight: 800; letter-spacing: -.01em; }
.chart-price { font-family: var(--font-num); font-size: var(--fs-2xl); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.chart-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--space-2); }
.meta-chip {
  display: inline-block; padding: 1px 8px;
  border: 1px solid var(--line); border-radius: 999px;
  font-size: var(--fs-xs); color: var(--text-dim); line-height: 1.6;
}
#kline, #kline-fallback { width: 100%; height: 316px; }
#equity, #equity-fallback { width: 100%; height: 148px; }
.chart-fallback { display: block; background: var(--screen); border-radius: var(--radius-sm); }
.fallback-note {
  font-size: var(--fs-sm); color: var(--text-dim);
  background: var(--bg-sunken); border-left: 3px solid var(--accent);
  border-radius: var(--radius-sm);
  padding: 7px var(--space-3); margin-bottom: var(--space-3);
}
.fallback-note:empty { display: none; }

/* ==========================================================================
   交易区
   ========================================================================== */
.trade-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: var(--space-3); }
.field label { font-size: var(--fs-xs); color: var(--text-faint); }
.field input, .field select {
  background: var(--bg-sunken); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 7px 9px; font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 600;
  transition: border-color .12s, background .12s;
}
.field input:hover, .field select:hover { border-color: var(--text-faint); }
.field input:focus, .field select:focus { border-color: var(--text); background: var(--bg-raised); }
.hint { font-size: var(--fs-xs); color: var(--text-faint); line-height: 1.5; }
.seg { display: inline-flex; background: var(--bg-sunken); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 2px; gap: 2px; }
.seg button {
  background: transparent; border: 0; padding: 4px 11px; color: var(--text-dim);
  font-size: var(--fs-sm); border-radius: 3px; transition: background .12s, color .12s;
}
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--bg-raised); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(24,32,42,.12); }
.trade-actions { display: flex; gap: var(--space-2); margin-top: var(--space-4); }
.trade-actions .btn { padding: 9px 20px; }
.trade-actions #btn-next { margin-left: auto; }

/* ==========================================================================
   新闻流 / 情绪
   ========================================================================== */
.news-list { max-height: 46vh; overflow-y: auto; display: flex; flex-direction: column; }
.news-item { padding: 10px var(--space-3); border-bottom: 1px solid var(--line-soft); }
.news-item:last-child { border-bottom: 0; }
.news-item:hover { background: rgba(128,140,155,.07); }
.news-tags { display: flex; gap: var(--space-1); align-items: center; margin-bottom: 3px; }
.news-tag {
  font-size: 10px; padding: 0 5px; border-radius: 999px; line-height: 1.7;
  border: 1px solid var(--line); color: var(--text-faint);
}
.news-tag.rumor { border-color: var(--text-faint); border-style: dashed; color: var(--text-faint); }
.news-tag.bad { border-color: var(--danger); color: var(--danger); }
.news-tag.good { border-color: var(--up); color: var(--up); }
.news-text { font-size: var(--fs-md); line-height: 1.55; max-width: 62ch; }
.news-text .sym { font-weight: 700; }
/* 上一天的消息保留显示，但做视觉降级：变淡 + 一条「昨日」分隔 */
.news-item.is-past { opacity: .62; }
.news-item.is-past:hover { opacity: 1; }
.news-sep {
  padding: 5px var(--space-3); font-size: var(--fs-xs); color: var(--text-faint);
  background: var(--bg-sunken); border-bottom: 1px solid var(--line-soft);
  position: sticky; top: 0; z-index: 1;
}

.emo-bar { height: 10px; border-radius: 999px; background: var(--bg-sunken); overflow: hidden; border: 1px solid var(--line-soft); }
/* 这一处渐变是有语义的：横向就是"恐惧 → 贪婪"这根轴 */
.emo-fill { height: 100%; background: linear-gradient(90deg, var(--down), #b9c2cc 50%, var(--up)); transition: width .35s ease-out; }
.emo-scale { display: flex; justify-content: space-between; font-size: var(--fs-xs); color: var(--text-faint); margin-top: 5px; }

/* ==========================================================================
   提示条 / 弹层
   ========================================================================== */
#notices { position: fixed; right: var(--space-4); bottom: var(--space-4); z-index: 60; display: flex; flex-direction: column; gap: var(--space-2); max-width: 340px; }
.notice {
  background: var(--bg-raised); border: 1px solid var(--line);
  border-left: 3px solid var(--text-faint);
  border-radius: var(--radius-md); padding: 9px var(--space-3); font-size: var(--fs-sm);
  box-shadow: 0 6px 18px rgba(24,32,42,.14); animation: slide-in .18s ease-out;
}
.notice.bad { border-left-color: var(--danger); }
.notice.good { border-left-color: var(--up); }
@keyframes slide-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.modal-backdrop {
  position: fixed; inset: 0; background: rgba(15,21,29,.55); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; padding: var(--space-4); z-index: 80;
}
.modal {
  background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--radius-lg);
  box-shadow: 0 24px 60px rgba(15,21,29,.30); max-width: 560px; width: 100%; max-height: 86vh; overflow-y: auto;
}
.modal-head { padding: var(--space-5) var(--space-5) var(--space-4); border-bottom: 1px solid var(--line-soft); }
.modal-title { font-size: var(--fs-2xl); font-weight: 800; letter-spacing: -.02em; }
.modal-sub { color: var(--text-faint); font-size: var(--fs-sm); margin-top: 3px; }
.modal-body { padding: var(--space-4) var(--space-5); }
.modal-highlight {
  background: var(--bg-sunken); border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4); margin: var(--space-3) 0;
}
.score-row { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-4); padding: 7px 0; border-bottom: 1px solid var(--line-soft); }
.score-row:last-child { border-bottom: 0; }
.score-key { color: var(--text-dim); font-size: var(--fs-sm); }
.score-val { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 700; }
.score-val.plain { font-weight: 500; color: var(--text-dim); font-size: var(--fs-sm); }
.modal-foot { padding: var(--space-3) var(--space-5) var(--space-5); display: flex; gap: var(--space-2); justify-content: flex-end; flex-wrap: wrap; }
.empty { color: var(--text-faint); font-size: var(--fs-sm); padding: var(--space-4) var(--space-3); text-align: center; line-height: 1.6; }

/* ==========================================================================
   响应式：移动端切换为底部标签 + 单列
   ========================================================================== */
/* 行业/板块标签的颜色深浅随材质切换 */
:root { --tag-a: #2f6fb5; --tag-b: #6b5bd2; }
.screen { --tag-a: #7fb3e8; --tag-b: #a99df0; }

/* 深色屏上的滚动条也应当是深色的 */
.market-table::-webkit-scrollbar, .news-list::-webkit-scrollbar { width: 8px; }
.market-table::-webkit-scrollbar-thumb { background: var(--screen-line); border-radius: 4px; }
.news-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
.market-table::-webkit-scrollbar-track, .news-list::-webkit-scrollbar-track { background: transparent; }

@media (max-width: 1080px) {
  .layout { grid-template-columns: 1fr; padding-bottom: 72px; }
  .panel { display: none; }
  .panel.is-shown { display: block; }
  .mobile-tabs {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 0;
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    background: var(--bg-raised); border-top: 1px solid var(--line);
    box-shadow: 0 -2px 12px rgba(24,32,42,.07);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .mobile-tabs button {
    background: transparent; border: 0; border-top: 2px solid transparent;
    padding: 13px 0; color: var(--text-faint); font-size: var(--fs-sm);
  }
  .mobile-tabs button.on { color: var(--text); font-weight: 700; border-top-color: var(--accent); }
  .topbar { flex-wrap: wrap; gap: var(--space-2); }
  /* 手机上让品牌与按钮同一行，行情条独占第二行，省下一行高度 */
  .brand { order: 1; }
  .topbar-actions { order: 2; margin-left: auto; }
  .ticker { order: 3; gap: var(--space-4); width: 100%; justify-content: space-between; }
  .tick { align-items: flex-start; }
